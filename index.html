<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 项目课</title>
<style>
:root{--bg:#f6f7f5;--paper:#fff;--fg:#1d2520;--muted:#5d6a62;--line:#dde3de;--ink:#b4232f}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--paper:#1b231f;--fg:#e4ebe6;--muted:#9aa8a0;--line:#2c3832;--ink:#f0707a;color-scheme:dark}}
body{background:var(--bg);color:var(--fg);font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.75;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:32px 16px}
h1{font-size:30px;margin:0 0 16px}
a.card{display:block;padding:14px 18px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--fg);text-decoration:none;margin:10px 0}
a.card:hover{border-color:var(--ink)}
.t{font-weight:700;font-size:18px}.d{color:var(--muted);font-size:14px}
</style>
</head>
<body><div class="wrap">
<h1>AI 项目课</h1>
<a class="card" href="guess-who/"><div class="t">猜猜我是谁</div><div class="d">AI 猜谜游戏 · 8 课 · NiceGUI 网页界面 + 调用 AI</div></a>
</div></body>
</html>
